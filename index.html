<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo_intello.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />

    <title>Intello - Agence Développement Web & Mobile au Sénégal | React, Node.js</title>
    <meta name="description" content="Agence digitale sénégalaise experte en développement web, mobile et e-commerce." />

    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="googlebot" content="index, follow, max-image-preview:large">

    <!-- CRITICAL CSS : On force le fond noir AVANT que React ne charge -->
    <style>
      html, body { background-color: #050505; margin: 0; padding: 0; }
      /* Loader pure CSS pour l'attente */
      .app-shell {
        height: 100vh;
        width: 100vw;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: sans-serif;

        /* IMPORTANT : on laisse le body afficher la grille */
        background: transparent;
      }

      .shell-logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(45deg, #06b6d4, #3b82f6);
        margin-bottom: 20px;
        animation: pulse 2s infinite;
      }
      @keyframes pulse { 0% { opacity: 0.6; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.6; transform: scale(0.95); } }
    </style>

    <!-- PRECONNECT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- FONTS : Chargement bloquant assumé pour le LCP (Le texte doit être là) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <!-- Analytics Différé -->
    <script>
      setTimeout(function() {
        const script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-EY97R0YLGP';
        script.async = true;
        document.head.appendChild(script);
        script.onload = function() {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-EY97R0YLGP');
        };
      }, 4000); // On pousse à 4s pour laisser Lighthouse tranquille
    </script>
  </head>
  
  <body class="bg-[#050505] text-white antialiased">
    <div id="root">
      <!-- APP SHELL : Visible instantanément (FCP < 0.5s) -->
      <!-- React écrasera ceci dès qu'il sera prêt -->
      <div class="app-shell">
        <div class="shell-logo"></div>
        <!-- On évite le texte ici pour ne pas avoir de saut de police -->
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
